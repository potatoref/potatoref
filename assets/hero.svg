<text x="945" y="75" text-anchor="middle" class="m" font-size="14" font-weight="700" fill="#4285F4">API</text></g><g>
<circle cx="1095" cy="220" r="30" fill="none" stroke="#EA4335" stroke-width="2"><animate attributeName="r" values="30;50" dur="2.4s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
<circle cx="1095" cy="220" r="30" fill="#161b22" stroke="#EA4335" stroke-width="2"/>
<text x="1095" y="225" text-anchor="middle" class="m" font-size="14" font-weight="700" fill="#EA4335">DB</text></g><g>
<circle cx="945" cy="370" r="30" fill="none" stroke="#FBBC05" stroke-width="2"><animate attributeName="r" values="30;50" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
