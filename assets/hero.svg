<text x="64" y="86" class="m" font-size="18" fill="#6e7681" clip-path="url(#type)">~/berlin <tspan fill="#34A853">❯</tspan> <tspan fill="#e6edf3">whoami</tspan></text>
<rect class="cur" x="296" y="70" width="10" height="20" fill="#4285F4"/>
<text x="60" y="178" class="s in" style="animation-delay:1.2s" font-size="68" font-weight="800" letter-spacing="-2" fill="url(#flow)">Refik Can Bozkurt</text>
<text x="64" y="228" class="s in" style="animation-delay:1.5s" font-size="24" fill="#9198a1">Backend Engineer at <tspan fill="#e6edf3" font-weight="700">Google</tspan> · Berlin</text>
<g class="in" style="animation-delay:1.8s"><text x="64" y="286" class="s" font-size="26" font-weight="600" fill="#e6edf3">I build</text><text x="166" y="286" class="s wd" font-size="26" font-weight="600" fill="#4285F4" style="animation-delay:0s">scalable APIs.</text><text x="166" y="286" class="s wd" font-size="26" font-weight="600" fill="#EA4335" style="animation-delay:3s">distributed systems.</text><text x="166" y="286" class="s wd" font-size="26" font-weight="600" fill="#FBBC05" style="animation-delay:6s">reliable infrastructure.</text><text x="166" y="286" class="s wd" font-size="26" font-weight="600" fill="#34A853" style="animation-delay:9s">Gemini, at Google scale.</text></g>
<g class="pop" style="animation-delay:2.20s"><rect x="64" y="330" width="124" height="34" rx="17" fill="#161b22" fill-opacity=".8" stroke="#30363d"/><circle cx="82" cy="347" r="3.5" fill="#4285F4"/><circle cx="91" cy="347" r="3.5" fill="#EA4335"/><circle cx="100" cy="347" r="3.5" fill="#FBBC05"/><circle cx="109" cy="347" r="3.5" fill="#34A853"/><text x="122" y="352" class="m" font-size="14" fill="#e6edf3">Google</text></g><g class="pop" style="animation-delay:2.35s"><rect x="198" y="330" width="118" height="34" rx="17" fill="#161b22" fill-opacity=".8" stroke="#30363d"/><text x="214" y="352" class="m" font-size="14" fill="#e6edf3">Berlin, DE</text></g><g class="pop" style="animation-delay:2.50s"><rect x="326" y="330" width="158" height="34" rx="17" fill="#161b22" fill-opacity=".8" stroke="#30363d"/><text x="342" y="352" class="m" font-size="14" fill="#e6edf3">4+ yrs backend</text></g><g class="pop" style="animation-delay:2.65s"><rect x="494" y="330" width="176" height="34" rx="17" fill="#161b22" fill-opacity=".8" stroke="#30363d"/><text x="510" y="352" class="m" font-size="14" fill="#e6edf3">Go · Python · JS</text></g>
