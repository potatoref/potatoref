<rect width="1200" height="440" fill="#0d1117"/>
<circle cx="760" cy="80" r="170" fill="#4285F4" opacity=".22" filter="url(#blur)">
<animateTransform attributeName="transform" type="translate" values="0 0;90 50;0 0" dur="14s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="1120" cy="120" r="170" fill="#EA4335" opacity=".22" filter="url(#blur)">
<animateTransform attributeName="transform" type="translate" values="0 0;-80 70;0 0" dur="17s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="1060" cy="420" r="170" fill="#FBBC05" opacity=".22" filter="url(#blur)">
<animateTransform attributeName="transform" type="translate" values="0 0;-70 -60;0 0" dur="15s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="620" cy="420" r="170" fill="#34A853" opacity=".22" filter="url(#blur)">
