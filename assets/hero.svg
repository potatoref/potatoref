<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Refik Can Bozkurt — Backend Engineer at Google, Berlin">
<defs>
<clipPath id="card"><rect width="1200" height="440" rx="20"/></clipPath>
<filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="70"/></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e6edf3" opacity=".09"/></pattern>
<linearGradient id="fadeL" x1="0" x2="1"><stop offset=".35" stop-color="#0d1117" stop-opacity=".92"/><stop offset=".62" stop-color="#0d1117" stop-opacity="0"/></linearGradient>
<linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#4285F4"/><stop offset=".25" stop-color="#EA4335"/><stop offset=".5" stop-color="#FBBC05"/><stop offset=".75" stop-color="#34A853"/><stop offset="1" stop-color="#4285F4"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#4285F4"/><stop offset=".25" stop-color="#EA4335"/><stop offset=".5" stop-color="#FBBC05"/><stop offset=".75" stop-color="#34A853"/><stop offset="1" stop-color="#4285F4"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="4s" repeatCount="indefinite"/>
</linearGradient>
<clipPath id="type"><rect x="64" y="60" width="0" height="34"><animate attributeName="width" from="0" to="290" begin=".2s" dur="1s" fill="freeze" calcMode="discrete" values="0;40;70;100;130;160;190;220;250;290" keyTimes="0;.11;.22;.33;.44;.55;.66;.77;.88;1"/></rect></clipPath>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}

.in{opacity:0;animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:in .6s cubic-bezier(.2,.8,.2,1) forwards}
.wd{opacity:0;animation:wd 12s infinite}
@keyframes wd{0%{opacity:0;transform:translateY(12px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-12px)}}
.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
</style>
</defs>
