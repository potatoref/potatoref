ount="indefinite"/></circle><g>
<circle cx="945" cy="70" r="30" fill="none" stroke="#4285F4" stroke-width="2"><animate attributeName="r" values="30;50" dur="2.4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle>
