<g><circle cx="945" cy="220" r="92" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="14 10"/><animateTransform attributeName="transform" type="rotate" from="360 945 220" to="0 945 220" dur="40s" repeatCount="indefinite"/></g>
