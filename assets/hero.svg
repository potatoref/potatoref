<text x="945" y="375" text-anchor="middle" class="m" font-size="14" font-weight="700" fill="#FBBC05">CDN</text></g><g>
<circle cx="795" cy="220" r="30" fill="none" stroke="#34A853" stroke-width="2"><animate attributeName="r" values="30;50" dur="2.4s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
<circle cx="795" cy="220" r="30" fill="#161b22" stroke="#34A853" stroke-width="2"/>
<text x="795" y="225" text-anchor="middle" class="m" font-size="14" font-weight="700" fill="#34A853">ML</text></g><rect x="897" y="172" width="96" height="96" rx="20" fill="#161b22" stroke="url(#flow)" stroke-width="3"/><rect x="915" y="190" width="60" height="16" rx="5" fill="#21262d"/><circle cx="925" cy="198" r="3.5" fill="#4285F4"><animate attributeName="opacity" values="1;.2;1" dur="0.80s" repeatCount="indefinite"/></circle><rect x="935" y="196" width="30" height="4" rx="2" fill="#30363d"/><rect x="915" y="212" width="60" height="16" rx="5" fill="#21262d"/><circle cx="925" cy="220" r="3.5" fill="#EA4335"><animate attributeName="opacity" values="1;.2;1" dur="1.15s" repeatCount="indefinite"/></circle><rect x="935" y="218" width="30" height="4" rx="2" fill="#30363d"/><rect x="915" y="234" width="60" height="16" rx="5" fill="#21262d"/><circle cx="925" cy="242" r="3.5" fill="#34A853"><animate attributeName="opacity" values="1;.2;1" dur="1.50s" repeatCount="indefinite"/></circle><rect x="935" y="240" width="30" height="4" rx="2" fill="#30363d"/>
